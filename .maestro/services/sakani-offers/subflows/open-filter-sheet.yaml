# Helper: open one filter sheet on the voucher list. Env: CHIP (chip label)
# Workaround: taps while the list settles are ignored; re-tap only while no Scrim is up
appId: fi.iwa.sakani
name: Open a voucher filter sheet
---
- repeat:
    times: 3
    while:
      notVisible: "Scrim"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: ${CHIP}
          optional: true
      - extendedWaitUntil:
          visible: "Scrim"
          timeout: 20000
          optional: true
- assertVisible: "Scrim"
