# Home search: support term returns FAQ answer with contact info, expands in place
appId: fi.iwa.sakani
name: Home search - support term returns the contact-channels FAQ, which expands in place
tags:
  - health-check
env:
  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011487" : String(NATIONAL_ID)}'
  SEARCH_SUPPORT_TERM: '${typeof SEARCH_SUPPORT_TERM === "undefined" ? "contact" : String(SEARCH_SUPPORT_TERM)}'
  SEARCH_SUPPORT_RESULT: '${typeof SEARCH_SUPPORT_RESULT === "undefined" ? "What are the communication channels with Sakani" : String(SEARCH_SUPPORT_RESULT)}'
  SEARCH_SUPPORT_CONTENT: '${typeof SEARCH_SUPPORT_CONTENT === "undefined" ? "199090" : String(SEARCH_SUPPORT_CONTENT)}'
---
- launchApp:
    clearState: true
- runFlow:
    file: ../../subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}
- runFlow:
    file: ../../subflows/clear-overlays.yaml
    env:
      ANCHOR: 'Home\s*Tab 1 of 4'
- runFlow:
    file: subflows/open-home-search.yaml

- tapOn:
    leftOf: "Cancel"
- inputText: ${SEARCH_SUPPORT_TERM}
- extendedWaitUntil:
    visible: "FAQ"
    timeout: 30000
- runFlow:
    file: ../../subflows/dismiss-keypad.yaml
# Support answer listed under FAQ with contact info
- assertVisible:
    text: ${"(?s).*" + SEARCH_SUPPORT_RESULT + ".*" + SEARCH_SUPPORT_CONTENT + ".*"}
    below: "FAQ"
- takeScreenshot: search-support-results

# Answer expands in place
- tapOn:
    text: "See more"
    childOf:
      text: ${"(?s).*" + SEARCH_SUPPORT_RESULT + ".*" + SEARCH_SUPPORT_CONTENT + ".*"}
- extendedWaitUntil:
    visible: "See less"
    timeout: 10000
- takeScreenshot: search-support-expanded

- tapOn: "Cancel"
- extendedWaitUntil:
    visible: 'Home\s*Tab 1 of 4'
    timeout: 15000
