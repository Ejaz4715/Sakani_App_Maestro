# Helper: open Profile completion from the Home Complete profile card
appId: fi.iwa.sakani
name: Open Profile completion from Home
---
- scrollUntilVisible:
    element:
      text: "(?s).*Complete your profile to access.*Complete profile"
    direction: UP
    timeout: 20000
- repeat:
    times: 3
    while:
      notVisible: "Profile completion"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "(?s).*Complete your profile to access.*Complete profile"
          optional: true
      - extendedWaitUntil:
          visible: "Profile completion"
          timeout: 20000
          optional: true
- assertVisible: "Profile completion"
- assertVisible: "(?s)House preferences.*"
- assertVisible: "(?s)Financial advisory.*"
