# Helper: open global search from the Home search bar (tap retried until open)
appId: fi.iwa.sakani
name: Open the Home global search
---
- scrollUntilVisible:
    element:
      text: "Looking for a property, service, or support?"
    direction: UP
    timeout: 20000
- repeat:
    times: 3
    while:
      notVisible: "Cancel"
    commands:
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Looking for a property, service, or support?"
          optional: true
      - extendedWaitUntil:
          visible: "Cancel"
          timeout: 15000
          optional: true
- assertVisible: "Cancel"
- assertVisible: "Trending Services"
- assertNotVisible: 'Home\s*Tab 1 of 4'
