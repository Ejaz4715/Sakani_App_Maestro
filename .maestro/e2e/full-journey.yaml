# DESTRUCTIVE: creates ONE real zero-fee booking ("Confirm booking"); needs authorization.
# No payment. Fee above 0 fails before commit; PASS only when Active booking is proven.
appId: fi.iwa.sakani
name: Full Journey - zero-fee booking
tags:
  - critical
  - release-readiness
env:

  NATIONAL_ID: '${typeof NATIONAL_ID === "undefined" ? "1000011487" : String(NATIONAL_ID)}'
  PROJECT: '${typeof PROJECT === "undefined" ? "مساكن طيبة المدائن EN" : String(PROJECT)}'
  PROJECT_SEARCH: '${typeof PROJECT_SEARCH === "undefined" ? "طيبة" : String(PROJECT_SEARCH)}'
  MODULE: '${typeof MODULE === "undefined" ? "Apartment" : String(MODULE)}'
  # Optional pin, e.g. "999-147": book exactly "<MODULE> <UNIT>" (never another unit); empty = first card
  UNIT: '${typeof UNIT === "undefined" ? "" : String(UNIT)}'
---
- evalScript: ${console.log('FULL JOURNEY TARGET NATIONAL_ID = [' + NATIONAL_ID + ']')}
- assertTrue: ${String(NATIONAL_ID).length === 10 && !/[^0-9]/.test(String(NATIONAL_ID)) && (String(NATIONAL_ID).charAt(0) === "1" || String(NATIONAL_ID).charAt(0) === "2")}

# Login with test account
- launchApp:
    clearState: true
- runFlow:
    file: ../subflows/login.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}

# Safety gate: signed-in profile National ID must match NATIONAL_ID before reserving
- runFlow:
    file: ../subflows/open-account-tab.yaml
    env:
      DESTINATION: "My bookings"
- runFlow:
    file: ../subflows/verify-signed-in-account.yaml
    env:
      NATIONAL_ID: ${NATIONAL_ID}
- assertTrue: ${output.loginNationalId === String(NATIONAL_ID) && output.profileNationalId === String(NATIONAL_ID)}

- tapOn: 'Explore\s*Tab 2 of 4'
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: "Registered Interests"

- tapOn: "(Construction Status|Ready Units|Readymade|Offplan|Land)"
- waitForAnimationToEnd:
    timeout: 8000

# Filter sheets are alternatives: "Start searching" first, "Apply" only as fallback
- evalScript: ${output.startSearchingSheet = false}
- runFlow:
    when:
      visible: "Start searching"
    commands:
      - evalScript: ${output.startSearchingSheet = true}
      - tapOn: "Buy"
      - assertVisible: "Offplan"
      - tapOn: "Offplan"
      - tapOn: "Start searching"

- runFlow:
    when:
      true: ${output.startSearchingSheet !== true}
    commands:
      - runFlow:
          when:
            visible: "Apply"
          commands:
            - tapOn: "Clear"
            - waitForAnimationToEnd:
                timeout: 5000
            - assertVisible: "Offplan"
            - tapOn: "Offplan"
            - tapOn: "Apply"

- waitForAnimationToEnd:
    timeout: 20000

- extendedWaitUntil:
    visible: "Offplan"
    timeout: 45000
# Results or saved-location empty state; the PROJECT search below replaces any saved location
- runFlow:
    file: ../subflows/explore-results-or-empty.yaml
- takeScreenshot: journey-2-marketplace
# Open search sheet: fast path, guarded fallback loop; arrival = search input + Cancel
- evalScript: ${output.searchSheetOpen = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          point: "55%,11%"
      - extendedWaitUntil:
          visible:
            text: "Cancel"
            rightOf: "Enter Region, City, Neighborhood, Street, Project, Developer, Building Number, Block Number"
          timeout: 10000
      - evalScript: ${output.searchSheetOpen = true}
- runFlow:
    when:
      true: ${output.searchSheetOpen !== true}
    commands:
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  notVisible:
                    text: "Cancel"
                    rightOf: "Enter Region, City, Neighborhood, Street, Project, Developer, Building Number, Block Number"
                commands:
                  - tapOn:
                      point: "55%,11%"
                  - waitForAnimationToEnd:
                      timeout: 8000
- extendedWaitUntil:
    visible:
      text: "Cancel"
      rightOf: "Enter Region, City, Neighborhood, Street, Project, Developer, Building Number, Block Number"
    timeout: 30000
- tapOn: "Enter Region, City, Neighborhood, Street, Project, Developer, Building Number, Block Number"
- inputText: ${PROJECT_SEARCH}

# Search project; tap the full name under the "Property" group only
- extendedWaitUntil:
    visible: "Property"
    timeout: 30000
- takeScreenshot: journey-2-search-results
- tapOn:
    text: "(?s).*${PROJECT}.*"
    below:
      text: "Property"

# Close one-off coach mark with Back, never its CTA
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: "About this project"

# Verify Project Details of a bookable Offplan project
- extendedWaitUntil:
    visible: "View units"
    timeout: 45000
- assertVisible: "About this project"
- assertVisible: "Bookings open"
- assertVisible: "(?s).*available units.*"

# Project type must be Offplan ("Units under construction")
- scrollUntilVisible:
    element:
      text: "Project type"
    direction: DOWN
    timeout: 45000
- assertVisible: "Units under construction"
- runFlow:
    when:
      visible: "Target audience"
    commands:
      - assertVisible: "For all"

- assertVisible: "Payment methods"
- assertVisible: "Cash"

# Select module, then a unit

- tapOn: "View units"
- extendedWaitUntil:
    visible: "(?s).*Unit list.*"
    timeout: 45000
- runFlow:
    when:
      visible: "Property type"
    commands:
      - tapOn: "Property type"
      - extendedWaitUntil:
          visible: "Apply"
          timeout: 20000
      - assertVisible: ${MODULE}
      - tapOn: ${MODULE}
      - tapOn: "Apply"
      - extendedWaitUntil:
          visible: "(?s).*Unit list.*"
          timeout: 45000

- assertNotVisible: "Scrim"

- extendedWaitUntil:
    visible: "(?s).*(Available|matched).*"
    timeout: 45000
- tapOn: "(?s).*${MODULE}s? (Available|matched).*"

- extendedWaitUntil:
    visible: "Eligibility type"
    timeout: 45000
- assertVisible: "(?s).*Prices.*"

# Record selected unit card for the same-booking proof (first card, or the pinned UNIT by name)
- runFlow:
    when:
      true: ${String(UNIT).length === 0}
    commands:
      - copyTextFrom:
          text: '(?s)${MODULE} [0-9A-Za-z-]+\n.*'
          index: 0
      - evalScript: ${output.selectedUnitCard = String(maestro.copiedText)}
      - tapOn:
          text: '(?s)${MODULE} [0-9A-Za-z-]+\n.*'
          index: 0
- runFlow:
    when:
      true: ${String(UNIT).length > 0}
    commands:
      - scrollUntilVisible:
          element:
            text: '(?s)${MODULE} ${UNIT}\n.*'
          direction: DOWN
          timeout: 90000
          label: "TEST DATA - ${MODULE} ${UNIT} is not listed among the available units; nothing reserved, no other unit chosen"
      - copyTextFrom:
          text: '(?s)${MODULE} ${UNIT}\n.*'
      - evalScript: ${output.selectedUnitCard = String(maestro.copiedText)}
      - tapOn:
          text: '(?s)${MODULE} ${UNIT}\n.*'

# Verify Unit Details is reservable
- extendedWaitUntil:
    visible: "Mortgage Calculator"
    timeout: 45000
- assertVisible: "(?s).*Unit Price.*"
- assertVisible: "Reserve unit"
- takeScreenshot: journey-3-unit-details

# Reserve unit

- tapOn: "Reserve unit"

# Always answer Yes to "reserve another unit" (discards earlier pending booking)
# Stop point: "Active contract detected" fails as a blocker, nothing committed
- extendedWaitUntil:
    visible: "(?s)(Booking summary|You are reserving another unit.*|.*Active contract detected.*)"
    timeout: 45000
- runFlow:
    when:
      visible: "(?s).*Active contract detected.*"
    commands:
      - takeScreenshot: journey-4-BLOCKED-active-contract
      - assertNotVisible:
          text: "(?s).*Active contract detected.*"
          label: "BLOCKED - the account has an active subsidy contract (Active contract detected!) - no booking attempted, needs PRE backend cleanup"
- extendedWaitUntil:
    visible: "(?s)(Booking summary|You are reserving another unit.*)"
    timeout: 45000
- runFlow:
    when:
      visible: "(?s)You are reserving another unit.*"
    commands:
      - assertVisible: "Are you sure?"
      - evalScript: "${console.log('RESERVE - pending booking on another unit; discarding it with Yes and reserving this unit')}"
      - takeScreenshot: journey-4-reserve-another-unit-dialog
      - tapOn:
          text: "^Yes$"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          notVisible: "Are you sure?"
          timeout: 15000
          label: "RESERVE - pending booking confirmation dialog did not close after Yes"

- extendedWaitUntil:
    visible: "Booking summary"
    timeout: 45000
- assertVisible: "Please check your reservation details below and click Confirm booking."
- extendedWaitUntil:
    visible: "Booking Details"
    timeout: 30000

- scrollUntilVisible:
    element:
      text: "Project Type"
    direction: DOWN
    timeout: 30000

# Second Offplan gate before commit ("Off-plan" on this screen)
- assertVisible: "Project Type"
- assertVisible: "(?s).*Off-?plan.*"

- scrollUntilVisible:
    element:
      text: "Booking Fee"
    direction: DOWN
    timeout: 30000
- assertVisible: "Booking Fee"
- takeScreenshot: journey-4-booking-summary

# Stop point: zero-fee path only; fee above 0 is unsuitable test data, fails before commit
- assertVisible: "Unit booking"
# Some summaries have no Booking disclaimer (seen 20/10/2026): scroll to the end to decide
- scrollUntilVisible:
    element:
      text: "Booking disclaimer"
    direction: DOWN
    timeout: 15000
    optional: true
- evalScript: ${output.noDisclaimer = false}
- runFlow:
    when:
      visible: "Booking disclaimer"
    commands:
      - copyTextFrom:
          text: '[0-9][0-9,]*(\.[0-9]+)?'
          below: "Booking Fee"
          above: "Booking disclaimer"
- runFlow:
    when:
      notVisible: "Booking disclaimer"
    commands:
      - evalScript: ${output.noDisclaimer = true}
      # No acknowledgement of any kind may be pending when the disclaimer is absent
      - assertNotVisible:
          text: "(?s).*(I have read and understood|Terms and Conditions|[Dd]isclaimer).*"
          label: "SUMMARY - an acknowledgement is shown without the known Booking disclaimer layout; stopping before Confirm booking"
      - copyTextFrom:
          text: '[0-9][0-9,]*(\.[0-9]+)?'
          below: "Booking Fee"
          above: "Confirm booking"
- evalScript: ${output.bookingFee = Number(String(maestro.copiedText).replace(/,/g, ""))}
- evalScript: "${console.log('BOOKING SUMMARY - Booking Fee rendered as [' + maestro.copiedText + '] = ' + output.bookingFee)}"
- assertTrue:
    condition: ${output.bookingFee === 0}
    label: "TEST DATA - Booking Fee is not 0: unit unsuitable for the zero-fee journey"
- assertNotVisible:
    text: "Pay booking fee"
    label: "TEST DATA - summary offers Pay booking fee: unit unsuitable for the zero-fee journey"
- assertVisible:
    text: "Confirm booking"
    label: "PRECONDITION - zero-fee summary must expose Confirm booking"

# Record block and unit number; summary must match the selected card
- copyTextFrom:
    text: '[0-9]+'
    below: "Block"
- evalScript: ${output.unitBlock = String(maestro.copiedText)}
- copyTextFrom:
    text: '[0-9]+'
    below:
      text: "${MODULE}"
      index: 0
- evalScript: ${output.unitNumber = String(maestro.copiedText)}
- evalScript: "${console.log('ZERO-FEE UNIT - card [' + String(output.selectedUnitCard).replace(/\\n/g, ' | ') + '] block [' + output.unitBlock + '] ' + MODULE + ' [' + output.unitNumber + ']')}"
- assertTrue:
    condition: ${String(output.selectedUnitCard).indexOf(output.unitBlock + '-' + output.unitNumber) >= 0}
    label: "PRECONDITION - booking summary is not for the selected unit card"

# Acknowledge disclaimer (when the summary has one), then confirm booking
- runFlow:
    when:
      true: ${output.noDisclaimer !== true}
    commands:
      - scrollUntilVisible:
          element:
            text: "I have read and understood the Booking disclaimer"
          direction: DOWN
          timeout: 30000
      - assertVisible: "Booking disclaimer"
      - assertVisible: "I have read and understood the Booking disclaimer"
      - waitForAnimationToEnd:
          timeout: 5000

      # Disclaimer checkbox has no semantic state: proven by pixels; tap only if not ticked
      - evalScript: ${output.disclaimerTicked = false}
      - runFlow:
          optional: true
          commands:
            - assertScreenshot:
                path: ../reference-screenshots/booking/disclaimer-ticked.png
                cropOn:
                  leftOf: "I have read and understood the Booking disclaimer"
                  below: "Read all"
                  above: "Confirm booking"
                thresholdPercentage: 95
            - evalScript: ${output.disclaimerTicked = true}
      - runFlow:
          when:
            true: ${output.disclaimerTicked !== true}
          commands:
            - evalScript: "${console.log('DISCLAIMER - checkbox does not match the ticked reference; ticking it once')}"
            - tapOn:
                leftOf: "I have read and understood the Booking disclaimer"
                below: "Read all"
                above: "Confirm booking"
                retryTapIfNoChange: false
            - waitForAnimationToEnd:
                timeout: 5000
      - assertScreenshot:
          path: ../reference-screenshots/booking/disclaimer-ticked.png
          cropOn:
            leftOf: "I have read and understood the Booking disclaimer"
            below: "Read all"
            above: "Confirm booking"
          thresholdPercentage: 95
          label: "DISCLAIMER - the Booking disclaimer checkbox is not ticked"
      - evalScript: "${console.log('DISCLAIMER - acknowledgement proven by the ticked checkbox pixels (already ticked on arrival=' + output.disclaimerTicked + ')')}"
- runFlow:
    when:
      true: ${output.noDisclaimer === true}
    commands:
      - evalScript: "${console.log('DISCLAIMER - this summary has no Booking disclaimer or acknowledgement (live PRE 20/10/2026); nothing to tick')}"
- assertVisible: "Confirm booking"
- takeScreenshot: journey-5-before-confirm

# State-changing: confirm booking once, no re-tap (could create a second booking)
- tapOn:
    text: "Confirm booking"
    retryTapIfNoChange: false
- takeScreenshot: journey-5-after-confirm-tap
# Post-confirm signals are informational; proof is the persisted booking below
- evalScript: ${output.summaryLeft = false}
- runFlow:
    optional: true
    commands:
      - extendedWaitUntil:
          notVisible: "Please check your reservation details below and click Confirm booking."
          timeout: 15000
      - evalScript: ${output.summaryLeft = true}
# A product error after confirm fails the run
- assertNotVisible:
    text: '(?s)(.*There.s something wrong.*|.*the service is down.*|Error!)'
    label: "CONFIRM - the product reported an error after Confirm booking"
- evalScript: ${output.confirmBannerSeen = false}
- runFlow:
    optional: true
    commands:
      - extendedWaitUntil:
          visible: "(?s).*Your booking has been confirmed!.*"
          timeout: 15000
      - evalScript: ${output.confirmBannerSeen = true}
- takeScreenshot: journey-5-post-confirm-state
- evalScript: "${console.log('AFTER CONFIRM - summary text gone=' + output.summaryLeft + ' | confirmation banner seen=' + output.confirmBannerSeen + ' (informational; proof = Active booking of this unit)')}"

# Informational: log if app left foreground (PRE ribbon absent) after confirm
- evalScript: ${output.appInForegroundAfterConfirm = false}
- runFlow:
    when:
      visible: 'PRE-[0-9]+(\.[0-9]+)*-[0-9]+'
    commands:
      - evalScript: ${output.appInForegroundAfterConfirm = true}
- runFlow:
    when:
      true: ${output.appInForegroundAfterConfirm !== true}
    commands:
      - evalScript: "${console.log('APP LEFT FOREGROUND after Confirm booking (crash suspected - see device logcat); relaunching to reach the persisted booking')}"
      - takeScreenshot: journey-5-app-not-in-foreground

# Verify booking in My bookings -> Active; warm relaunch if no Account tab
- runFlow:
    when:
      notVisible: '(?s)(Account\s*Tab 4 of 4|.*(?:would you recommend benefiting from Sakani|likely are you to recommend Sakani App).*)'
    commands:
      - evalScript: "${console.log('AFTER CONFIRM - no Account tab on the post-confirm screen; warm relaunch to Home')}"
      - launchApp
# Dismiss satisfaction survey covering the tab bar
- runFlow:
    file: ../subflows/clear-overlays.yaml
    env:
      ANCHOR: 'Account\s*Tab 4 of 4'
# Fast path first, shared helpers as fallback
- evalScript: ${output.accountReached = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          text: 'Account\s*Tab 4 of 4'
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: "My bookings"
          timeout: 15000
      - evalScript: ${output.accountReached = true}
- runFlow:
    when:
      true: ${output.accountReached !== true}
    commands:
      - runFlow:
          file: ../subflows/open-account-tab.yaml
          env:
            DESTINATION: "My bookings"
- evalScript: ${output.bookingsReached = false}
- runFlow:
    optional: true
    commands:
      - tapOn:
          text: "My bookings"
          retryTapIfNoChange: false
      - extendedWaitUntil:
          visible: 'Active\s*Tab 2 of 4'
          timeout: 15000
      - evalScript: ${output.bookingsReached = true}
- runFlow:
    when:
      true: ${output.bookingsReached !== true}
    commands:
      - runFlow:
          file: ../subflows/tap-until-destination.yaml
          env:
            TARGET: "My bookings"
            DESTINATION: 'Active\s*Tab 2 of 4'
- evalScript: "${console.log('STAGE 6 NAVIGATION - Account fast path=' + output.accountReached + ' | My bookings fast path=' + output.bookingsReached)}"
- tapOn: 'Active\s*Tab 2 of 4'
- extendedWaitUntil:
    visible: "(?s).*(\nActive\n.*Unit code|don.t have any active booking).*"
    timeout: 30000
- takeScreenshot: journey-without-fee-my-bookings-active
- assertNotVisible:
    text: "(?s).*don.t have any active booking.*"
    label: "BOOKING - no Active booking exists after Confirm booking"

# Find the card by unit identity (block-unit), never by position
- scrollUntilVisible:
    element:
      text: "(?s).*\nActive\n.*\nUnit code\n[0-9]{2}(-[0-9]+)*-${output.unitBlock}-${output.unitNumber}\n.*"
    direction: DOWN
    timeout: 30000
    label: "BOOKING - no Active booking for the booked unit (block ${output.unitBlock}, unit ${output.unitNumber})"
- copyTextFrom:
    text: "(?s).*\nActive\n.*\nUnit code\n[0-9]{2}(-[0-9]+)*-${output.unitBlock}-${output.unitNumber}\n.*"
- evalScript: ${output.activeCard = String(maestro.copiedText)}
- evalScript: '${output.unitCode = (output.activeCard.match(/Unit code\s*([0-9]{2}(-[0-9]+)+)/) || ["", ""])[1]}'
- evalScript: "${console.log('ZERO-FEE BOOKING - Active card [' + output.activeCard.replace(/\\n/g, ' | ') + '] unit code [' + output.unitCode + ']')}"
- assertTrue:
    condition: ${output.unitCode.length > 0 && output.unitCode.slice(-(output.unitBlock.length + output.unitNumber.length + 2)) === '-' + output.unitBlock + '-' + output.unitNumber}
    label: "BOOKING - the Active booking's unit code is not the booked unit"
- tapOn: "(?s).*\nActive\n.*\nUnit code\n${output.unitCode}\n.*"

# End: Booking Details of the new booking opened
- extendedWaitUntil:
    visible: 'Booking Details\s*Tab 1 of 2'
    timeout: 30000
- takeScreenshot: journey-final-booking-details
- evalScript: "${console.log('FULL JOURNEY END - booking created and opened successfully, unit code [' + output.unitCode + '], block [' + output.unitBlock + '], unit [' + output.unitNumber + '] | app stayed in foreground after Confirm=' + output.appInForegroundAfterConfirm + ' (informational)')}"
